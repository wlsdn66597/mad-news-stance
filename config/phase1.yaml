# ── Phase 1: 논문 재현 (GSM8K / MMLU) ─────────────────────────
# 소량 서브셋에서 vanilla / cot / majority / debate 정확도를 비교한다.
# 절대 수치보다 "debate > single/cot 경향" 재현이 목표.

models:
  qwen:                         # legacy alias for Qwen3-4B
    id: Qwen/Qwen3-4B
    system_prompt: null
    trust_remote_code: false
  qwen4:
    id: Qwen/Qwen3-4B
    system_prompt: null
    trust_remote_code: false
  qwen8:
    id: Qwen/Qwen3-8B
    system_prompt: null
    trust_remote_code: false
  exaone:
    id: LGAI-EXAONE/EXAONE-3.5-2.4B-Instruct
    system_prompt: null
    trust_remote_code: true

load_in_4bit: false             # 빈 4090이면 fp16
mem_fraction: null              # 공유 GPU면 0.18 등으로 상한
gpu_index: 0

seed: 0
split: test
sampling_protocol: paper
n: 100                          # paper-scale subset
max_new_tokens: 1024            # CoT가 '정답:' 전에 잘리던 문제로 512→1024 (E2→E3)

sampling:
  temperature: 1.0              # majority/debate 다양성용 (vanilla/cot 는 greedy)

majority:
  k: 3                           # 논문 "Multi-Agent (Majority)": debate와 같은 agent 수(3)로 독립 생성+다수결

debate:
  n_agents: 3
  n_rounds: 2

# shared summarization-memory (agent 수 확장 실험)
memory:
  max_new_tokens: 256
  temperature: 0.0
