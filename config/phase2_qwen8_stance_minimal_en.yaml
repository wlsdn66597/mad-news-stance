# Minimal English K-News-Stance debate experiment with Qwen3-8B.
models:
  qwen:
    id: Qwen/Qwen3-8B
    system_prompt: null
    trust_remote_code: false

data_path: data/k-news-stance_nosegment.json
prompt_profile: stance_minimal_en

load_in_4bit: false
mem_fraction: null
gpu_index: 0

seed: 0
split: test
n: 100
max_new_tokens: 256

sampling:
  temperature: 1.0

majority:
  k: 3

debate:
  n_agents: 3
  n_rounds: 2

memory:
  max_new_tokens: 256
  temperature: 0.0

# Majority and debate reuse the exact same three Round 0 responses.
share_round0: true
